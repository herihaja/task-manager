services:
    app:
        build: .
        container_name: taskflow_app
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        ports:
            - "8000:8000"
        depends_on:
            - db
            - vite
        networks:
            - task-manager

    db:
        image: mysql:8.0
        container_name: taskflow_db
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
            MYSQL_DATABASE: ${DB_DATABASE:-taskflow_db}
            MYSQL_USER: ${DB_USERNAME:-taskflow}
            MYSQL_PASSWORD: ${DB_PASSWORD:-password}
        ports:
            - "3306:3306"
        volumes:
            - db_data:/var/lib/mysql
        networks:
            - task-manager

    vite:
        image: node:18
        command: npm run dev
        ports:
            - "5173:5173"
        volumes:
            - .:/var/www/html
        working_dir: /var/www/html
        networks:
            - task-manager

networks:
    task-manager:

volumes:
    db_data:
